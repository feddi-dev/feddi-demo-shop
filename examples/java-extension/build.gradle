plugins {
    id 'java-library'
}

group = 'dev.feddi.demoshop.extension'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'dev.feddi:feddi-gateway-extension:2026-11-18-0811'
    implementation 'org.springframework.boot:spring-boot-autoconfigure:4.0.1'
}
